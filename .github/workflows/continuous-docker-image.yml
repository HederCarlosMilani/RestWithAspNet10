name: Continuous Integration, Delivery and Deployment with Github Actions and .NET 10

#on:
#  push:
#    branches: [ "master" ]
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create SQL Server Container
        run: |
          docker run -d --name sqlserver_test \
            -e "ACCEPT_EULA=Y" \
            -e "SA_PASSWORD=SuaSenhaForte123" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          
          timeout 90s bash -c "until docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'SuaSenhaForte123' -Q 'SELECT 1' -C; do sleep 5; done"

      - name: Create SQL Server Database
        run: docker exec sqlserver_test /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'SuaSenhaForte123' -Q "IF DB_ID('AspNet') IS NULL CREATE DATABASE [AspNet]" -C

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore RestWithAspNet10.slnx

      - name: Build ASP.NET 10 App
        run: dotnet build RestWithAspNet10.slnx --configuration Release --no-restore

      - name: Test ASP.NET 10 App
        run: dotnet test RestWithAspNet10.slnx --configuration Release --no-build --logger "console;verbosity=detailed"

      - name: Docker Compose Build
        run: docker compose build
        
      - name: Set Docker image version
        run: echo "IMAGE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Push to Docker Hub Container Registry
        run: |
          docker tag ${{secrets.DOCKER_USERNAME}}/rest-with-asp-net-10-scaffold:latest ${{secrets.DOCKER_USERNAME}}/rest-with-asp-net-10-scaffold:${IMAGE_VERSION}
          
          docker push ${{secrets.DOCKER_USERNAME}}/rest-with-asp-net-10-scaffold:latest
          docker push ${{secrets.DOCKER_USERNAME}}/rest-with-asp-net-10-scaffold:${IMAGE_VERSION}